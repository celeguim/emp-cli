apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project1
  namespace: argocd
spec:
  sourceRepos:
  - http://gitops
  - gitops
  destinations:
  - server: https://kubernetes.default.svc
    namespace: dev
  - server: https://kubernetes.default.svc
    namespace: uat
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
