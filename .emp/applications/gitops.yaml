apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/celeguim/gitops.git
    path: charts/microservice
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
