apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: argocd
spec:
  project: uat
  source:
    repoURL: https://github.com/example/repo.git
    path: charts/app1
    targetRevision: HEAD
  destination:
    server: k8s.c2
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
