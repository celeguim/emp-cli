kind: Application

metadata:
  name: payments
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/company/gitops.git
    path: services/payments
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: default
    